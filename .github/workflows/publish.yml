name: Publish

on:
  push:
    tags: ["v*"]

# One release at a time for a given tag.
#
# A tag push can be delivered more than once, and two runs of this workflow then
# race each other to npm: one publishes and the other is answered with a 409,
# which leaves a red run standing over a release that went out correctly. A red
# that means nothing is what teaches a reader to ignore red.
#
# Queued rather than cancelled, so the second run reaches the step that finds
# the version already published and says so.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      # This is also what backs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; setup-node still ships 10.x.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # No NODE_AUTH_TOKEN: authentication comes from the OIDC token, so there
      # is no long-lived npm secret stored on this repository.
      # Re-tagging a released version must not fail the run: the publish is the
      # side effect, and npm has it already.
      - name: Publish unless npm already has this version
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "npm already serves $name@$version; nothing to publish."
          else
            npm publish --provenance --access public
          fi

  bundle:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      # Dependencies are compiled in, so the bundle is one file rather than a
      # copy of node_modules.
      - run: npx tsup --config tsup.bundle.config.ts
      - name: Assemble the bundle
        run: |
          mkdir -p stage/server stage/assets
          cp bundle/index.js stage/server/
          cp packaging/manifest.json README.md LICENSE stage/
          cp assets/icon-512.png stage/assets/
      - name: Pack and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          npx --yes @anthropic-ai/mcpb@latest pack stage "$name-$version.mcpb"
          gh release view "v$version" >/dev/null 2>&1 \
            || gh release create "v$version" --title "v$version" --notes "See CHANGELOG.md."
          gh release upload "v$version" "$name-$version.mcpb" --clobber
